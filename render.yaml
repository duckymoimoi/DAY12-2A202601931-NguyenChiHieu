# CP5 — Cấu hình deploy Render (dùng nếu bạn chọn Render).
#
# Render đọc file này khi bạn tạo Blueprint từ repo GitHub.
# `sync: false` = Render hỏi giá trị lúc deploy, KHÔNG lưu secret vào repo.

services:
  - type: web
    name: day12-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: AGENT_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_FALLBACK_TO_MOCK
        value: "true"
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_MAX_TOKENS
        value: "2048"
      - key: GROQ_REASONING_EFFORT
        value: low
      - key: GROQ_INCLUDE_REASONING
        value: "false"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: RAG_ENABLED
        value: "true"
      - key: WEB_SEARCH_ENABLED
        value: "true"
      - key: WEB_SEARCH_MAX_RESULTS
        value: "4"
      - key: WEB_SCRAPE_ENABLED
        value: "true"
      - key: WEB_SCRAPE_MAX_PAGES
        value: "1"
      - key: TAVILY_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"
      - key: REDIS_URL
        fromService:
          name: day12-redis
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: day12-redis
    plan: free
    ipAllowList: []
